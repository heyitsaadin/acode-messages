name: Release

# Publishes acode-messages.zip as a GitHub Release for the version in plugin.json.
# Two ways to run it:
#   1. Push a tag like v1.1.2 (must match "version" in plugin.json).
#   2. Actions tab -> Release -> Run workflow (no git commands needed).
# If the release already exists, the zip is re-uploaded to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        run: |
          V=$(node -p "require('./plugin.json').version")
          echo "TAG=v$V" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $V"
            exit 1
          fi

      - name: Build main.js
        run: node build.js

      - name: Zip plugin files
        run: zip -j acode-messages.zip main.js plugin.json readme.md changelogs.md icon.png

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" acode-messages.zip --clobber
          else
            gh release create "$TAG" acode-messages.zip \
              --title "Acode Messages $TAG" \
              --notes-file changelogs.md \
              --target "$GITHUB_SHA"
          fi
