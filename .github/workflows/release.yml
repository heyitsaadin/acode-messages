name: Release

# Push a tag like v1.1.2 (matching "version" in plugin.json) to build the plugin
# and publish acode-messages.zip as a GitHub Release.
# You can also run it by hand from the Actions tab to test the build; that only
# uploads the zip as a workflow artifact and does not publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(node -p "require('./plugin.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $V"
            exit 1
          fi

      - name: Build main.js
        run: node build.js

      - name: Zip plugin files
        run: zip -j acode-messages.zip main.js plugin.json readme.md changelogs.md icon.png

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" acode-messages.zip \
            --title "Acode Messages $GITHUB_REF_NAME" \
            --notes-file changelogs.md \
            --verify-tag

      - name: Keep the zip from manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: acode-messages
          path: acode-messages.zip
