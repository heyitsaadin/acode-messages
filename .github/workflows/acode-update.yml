name: Update on Acode (existing plugin)

# Manual only. Uploads a new version of the plugin to acode.app as an UPDATE
# (PUT /api/plugin). Use this for every version after the first submission.
# For a brand new plugin use "Submit to Acode (new plugin)" instead.
#
# Before running: bump "version" in plugin.json (acode.app needs a higher
# version than the one it already has) and merge it into main.
#
# Needs the ACODE_API_KEY repo secret, from a key with "Publish plugin updates"
# for Acode Messages (acode.app/api-keys).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ACODE_API_KEY: ${{ secrets.ACODE_API_KEY }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$ACODE_API_KEY" ]; then
            echo "::error::ACODE_API_KEY secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        run: echo "Updating to version $(node -p "require('./plugin.json').version")"

      - name: Build main.js
        run: node build.js

      - name: Zip plugin files
        run: |
          zip -j acode-messages.zip main.js plugin.json readme.md changelogs.md icon.png
          zip -r acode-messages.zip project/

      - name: Check zip contents
        run: unzip -l acode-messages.zip

      - name: Publish update to acode.app
        run: |
          curl --fail-with-body -sS -X PUT https://acode.app/api/plugin \
            -H "Authorization: Bearer $ACODE_API_KEY" \
            -F "plugin=@acode-messages.zip"
          echo
          echo "Updated plugin on acode.app"
